# Least-privilege identity for the app (Step 7: RBAC)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: healthcare-app
  namespace: healthcare
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-db-secret
  namespace: healthcare
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["db-secret"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healthcare-app-read-db-secret
  namespace: healthcare
subjects:
- kind: ServiceAccount
  name: healthcare-app
  namespace: healthcare
roleRef:
  kind: Role
  name: read-db-secret
  apiGroup: rbac.authorization.k8s.io
