apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-app
  namespace: healthcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcare-app
  template:
    metadata:
      labels:
        app: healthcare-app
    spec:
      serviceAccountName: healthcare-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: myapp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: api-token
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { cpu: 250m, memory: 128Mi }
        readinessProbe:
          httpGet: { path: /health, port: 3000 }
        livenessProbe:
          httpGet: { path: /health, port: 3000 }
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-app
  namespace: healthcare
  labels:
    app: healthcare-app
spec:
  type: NodePort
  selector:
    app: healthcare-app
  ports:
  - name: http
    port: 80
    targetPort: 3000
    nodePort: 30080
